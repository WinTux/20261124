spring.application.name=seguimiento-service
server.port=8091
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=seguimiento-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.jafka.consumer.properties[spring.json.value.default.type]=com.software.seguimiento_service.event.PrincipalReceived
spring.jafka.consumer.properties[spring.json.trusted.packages]=com.software.seguimiento_service.event
spring.jafka.consumer.properties[spring.json.use.type.headers]=false